<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字地图 - 社会实践基地资源库（学生端）</title>
<!--@head inject: data, chinamap-->
<style>
/* ========== 大屏设计令牌 ========== */
:root{--bg1:#061A4A;--bg2:#0B2A7A;--glow:#3DD6FF;--glow2:#5B8CFF;--panel:rgba(16,52,140,.42);--panel-b:rgba(80,160,255,.28);--text:#E6F0FF;--text-2:#9FB7E6;--gold:#FFD36B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);font-size:14px;min-width:1280px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#1A47B8 0%,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2) 60%,#071C55)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(61,214,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(61,214,255,.05) 1px,transparent 1px);background-size:36px 36px}
a{color:inherit;text-decoration:none}
svg.lucide{width:16px;height:16px;stroke-width:2;flex-shrink:0}
.num{font-family:"DIN Alternate","Bahnschrift","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.screen{position:relative;height:100vh;display:grid;grid-template-rows:72px 104px 1fr;gap:12px;padding:0 20px 16px}

/* ========== 顶栏 ========== */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;position:relative}
.top-nav{display:flex;gap:8px}
.top-nav a,.top-r .tb{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;white-space:nowrap;font-size:13px;color:var(--text-2);border:1px solid var(--panel-b);background:rgba(20,70,180,.25);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:.2s}
.top-nav a:hover,.top-r .tb:hover{color:#fff;background:rgba(61,214,255,.18)}
.top-nav a.on{color:#fff;background:linear-gradient(90deg,rgba(61,214,255,.35),rgba(91,140,255,.25))}
.title{position:relative;padding:0 64px;height:72px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(40,110,255,.35),rgba(40,110,255,0));clip-path:polygon(0 0,100% 0,calc(100% - 48px) 100%,48px 100%)}
.title::after{content:"";position:absolute;left:48px;right:48px;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--glow),transparent)}
.title h1{font-size:26px;letter-spacing:5px;white-space:nowrap;font-weight:700;background:linear-gradient(180deg,#fff,#9FD8FF);-webkit-background-clip:text;color:transparent;text-shadow:0 0 24px rgba(61,214,255,.35)}
.title small{position:absolute;bottom:6px;font-size:11px;letter-spacing:4px;color:var(--text-2)}
.top-r{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.top-r .clock{font-size:13px;color:var(--text-2);margin-right:6px}
.top-r select{height:32px;background:rgba(20,70,180,.35);border:1px solid var(--panel-b);color:#fff;border-radius:4px;padding:0 8px;outline:none}
.top-r .me{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.top-r .clock{white-space:nowrap}
.top-r .me img{width:30px;height:30px;border-radius:50%;border:2px solid var(--glow);object-fit:cover}

/* ========== 指标卡 ========== */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(40,110,255,.18),rgba(40,110,255,.05));border:1px solid var(--panel-b)}
.kpi::before,.kpi::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--glow)}
.kpi::before{left:-1px;top:-1px;border-right:none;border-bottom:none}
.kpi::after{right:-1px;bottom:-1px;border-left:none;border-top:none}
.kpi b{font-size:38px;line-height:1.1;background:linear-gradient(180deg,#fff,#7CC8FF);-webkit-background-clip:text;color:transparent}
.kpi b small{font-size:14px;-webkit-text-fill-color:var(--text-2);margin-left:4px}
.kpi span{margin-top:6px;font-size:14px;letter-spacing:2px;padding:2px 24px;background:linear-gradient(90deg,transparent,rgba(61,150,255,.45),transparent)}

/* ========== 主体三栏 ========== */
.main{display:grid;grid-template-columns:260px 1fr 330px;gap:14px;min-height:0}
.panel{position:relative;background:var(--panel);border:1px solid var(--panel-b);display:flex;flex-direction:column;min-height:0;backdrop-filter:blur(4px)}
.panel-hd{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 30px;font-weight:600;font-size:15px;letter-spacing:1px;background:linear-gradient(90deg,rgba(61,150,255,.45),transparent);position:relative;flex-shrink:0}
.panel-hd::before{content:"";position:absolute;left:12px;width:8px;height:8px;background:var(--glow);transform:rotate(45deg);box-shadow:0 0 8px var(--glow)}
.panel-hd small{font-weight:400;font-size:12px;color:var(--text-2);letter-spacing:0}
.panel-hd a{font-weight:400;font-size:12px;color:var(--text-2)}
.panel-hd a:hover{color:var(--glow)}
.panel-bd{padding:10px 12px;overflow-y:auto;min-height:0}
.panel-bd::-webkit-scrollbar{width:4px}
.panel-bd::-webkit-scrollbar-thumb{background:rgba(61,214,255,.3);border-radius:2px}

/* 左栏：专题图例筛选 */
.cats{display:flex;flex-direction:column;gap:2px}
.cat{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--text-2);transition:.15s;border:1px solid transparent}
.cat:hover{background:rgba(61,214,255,.08);color:#fff}
.cat.on{color:#fff;background:rgba(61,214,255,.12);border-color:rgba(61,214,255,.35)}
.cat i{width:10px;height:10px;border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c);flex-shrink:0}
.cat span{flex:1}
.cat em{font-style:normal;font-size:12px;color:var(--text-2)}
.cat-all{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);padding:0 8px 6px}
.cat-all a{color:var(--glow);cursor:pointer}
.side-filters{flex-shrink:0;padding:10px 12px 8px;border-bottom:1px dashed var(--panel-b)}
.cat-scroll{flex:1;padding-top:8px}
.extra{margin:0;padding-top:2px;display:grid;gap:10px}
.extra label{font-size:12px;color:var(--text-2);display:block;margin-bottom:4px}
.seg{display:flex;border:1px solid var(--panel-b);border-radius:4px;overflow:hidden}
.seg span{flex:1;text-align:center;font-size:12px;padding:4px 0;cursor:pointer;color:var(--text-2)}
.seg span.on{background:rgba(61,214,255,.25);color:#fff}
.extra select{width:100%;height:30px;background:rgba(10,40,120,.6);border:1px solid var(--panel-b);color:#fff;border-radius:4px;padding:0 8px;outline:none}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-2)}
.sw{width:34px;height:18px;border-radius:9px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--glow)}
.sw.on::after{left:18px}

/* 中栏：地图 */
.map-box{position:relative;border:1px solid var(--panel-b);background:radial-gradient(ellipse at center,rgba(40,110,255,.18),transparent 70%);min-height:0}
#map{position:absolute;inset:0}
.search{position:absolute;left:16px;top:14px;z-index:5;display:flex;width:340px;height:38px;background:rgba(6,26,74,.85);border:1px solid var(--glow);box-shadow:0 0 16px rgba(61,214,255,.25)}
.search input{flex:1;background:none;border:none;outline:none;color:#fff;padding:0 12px;font-size:13px}
.search input::placeholder{color:var(--text-2)}
.search button{width:44px;background:linear-gradient(90deg,#2B6CFF,#3DD6FF);border:none;color:#fff;cursor:pointer;display:grid;place-items:center}
.suggest{position:absolute;left:16px;top:54px;width:340px;z-index:6;background:rgba(6,26,74,.96);border:1px solid var(--panel-b);display:none;max-height:240px;overflow:auto}
.suggest div{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;color:var(--text-2)}
.suggest div:hover{background:rgba(61,214,255,.12);color:#fff}
.map-tip{position:absolute;left:16px;top:60px;font-size:12px;color:var(--text-2);z-index:4}
.map-tip b{color:var(--gold)}
.zoom-tools{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:6px}
.zoom-tools span{width:56px;height:28px;display:grid;place-items:center;font-size:12px;background:rgba(6,26,74,.85);border:1px solid var(--panel-b);cursor:pointer;color:var(--text-2);transition:.15s}
.zoom-tools span:hover{color:#fff;border-color:var(--glow)}
.ai-cta{position:absolute;left:16px;bottom:16px;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 14px;background:linear-gradient(90deg,rgba(255,180,60,.25),rgba(255,120,60,.1));border:1px solid rgba(255,211,107,.6);cursor:pointer;transition:.25s;animation:breath 2.6s infinite}
.ai-cta:hover{transform:translateY(-2px);background:linear-gradient(90deg,rgba(255,180,60,.4),rgba(255,120,60,.18))}
.ai-cta .ic{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFD36B,#FF8A3D);display:grid;place-items:center;color:#5A2A00}
.ai-cta .ic svg{width:22px;height:22px}
.ai-cta b{display:block;color:var(--gold);font-size:15px}
.ai-cta small{font-size:12px;color:var(--text-2)}
@keyframes breath{50%{box-shadow:0 0 24px rgba(255,211,107,.35)}}

/* 右栏：案例榜 / 活跃基地 */
.rank-table{width:100%;font-size:13px;border-collapse:collapse}
.rank-table th{color:var(--text-2);font-weight:400;text-align:left;padding:4px 6px;font-size:12px}
.rank-table td{padding:7px 6px;border-bottom:1px solid rgba(80,160,255,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rank-table tr{cursor:pointer;transition:.15s}
.rank-table tbody tr:hover td{background:rgba(61,214,255,.1);color:#fff}
.rank-no{display:inline-grid;place-items:center;width:20px;height:20px;font-size:12px;border-radius:3px;background:rgba(255,255,255,.08)}
.rank-no.top{background:linear-gradient(135deg,#FFD36B,#FF8A3D);color:#5A2A00;font-weight:700}
.scroll-box{height:100%;overflow:hidden;position:relative}
.scroll-inner{animation:scrollUp 30s linear infinite}
.scroll-box:hover .scroll-inner{animation-play-state:paused}
@keyframes scrollUp{to{transform:translateY(-50%)}}
.hot{display:grid;gap:9px}
.hot-item{display:grid;grid-template-columns:20px 1fr 52px;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.hot-item .bar{grid-column:2/4;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.hot-item .bar i{display:block;height:100%;background:linear-gradient(90deg,#2B6CFF,#3DD6FF);border-radius:3px}
.hot-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot-item .vv{text-align:right;color:var(--glow);font-size:12px}
.right{display:grid;grid-template-rows:1.25fr 1fr;gap:14px;min-height:0}

/* ========== 基地详情弹窗 ========== */
.pop-mask{position:fixed;inset:0;background:rgba(2,10,30,.55);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.pop-mask.show{display:flex;padding:16px}
.pop{width:min(800px,100%);max-height:calc(100vh - 48px);overflow:auto;background:linear-gradient(180deg,#0E2F86,#0A2260);border:1px solid var(--glow);box-shadow:0 0 40px rgba(61,214,255,.3);animation:popIn .25s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.96)}}
.pop-hero{position:relative;height:132px}
.pop-hero img{width:100%;height:100%;object-fit:cover}
.pop-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,34,96,0) 30%,#0E2F86)}
.pop-hero .x{position:absolute;right:12px;top:12px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;cursor:pointer}
.pop-hero h2{position:absolute;left:20px;right:56px;bottom:12px;z-index:2;font-size:20px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-bd{padding:4px 20px 16px}
.pop-tags{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ptag{font-size:12px;padding:2px 10px;border:1px solid var(--c,var(--panel-b));color:var(--c,var(--text-2));background:color-mix(in srgb,var(--c,#3DD6FF) 12%,transparent)}
.pop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:13px;background:rgba(0,0,0,.15);padding:12px 14px;border:1px solid rgba(80,160,255,.18)}
.pop-grid div{display:flex;gap:8px;align-items:flex-start;min-width:0}
.pop-grid .k{color:var(--text-2);width:68px;flex-shrink:0;line-height:1.45}
.pop-grid .v{min-width:0;line-height:1.45;word-break:break-word}
.pop-grid .full{grid-column:span 2}
.pop h4{font-size:14px;margin:12px 0 6px;display:flex;align-items:center;gap:6px;color:var(--glow)}
.pop p.intro{font-size:13px;color:var(--text-2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pop-imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pop-imgs img{height:72px;width:100%;object-fit:cover;border:1px solid var(--panel-b);cursor:zoom-in;transition:.2s}
.pop-imgs img:hover{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow)}
.pop-imgs img:only-child{height:180px;max-width:420px}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(2,8,24,.86);display:none;align-items:center;justify-content:center}
.viewer.show{display:flex}
.viewer img{max-width:min(1080px,82vw);max-height:82vh;object-fit:contain;border:1px solid rgba(61,214,255,.45);box-shadow:0 0 40px rgba(61,214,255,.28);background:#061433}
.viewer .x,.viewer .nav{position:absolute;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25)}
.viewer .x{right:22px;top:18px;width:36px;height:36px;border-radius:50%}
.viewer .nav{top:50%;width:42px;height:64px;transform:translateY(-50%)}
.viewer .prev{left:18px}.viewer .next{right:18px}
.viewer .cap{position:absolute;bottom:22px;color:#D6E6FF;font-size:13px;letter-spacing:1px}
.past{display:grid;gap:6px}
.past div{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;font-size:13px;padding:8px 12px;background:rgba(61,150,255,.1);border-left:2px solid var(--gold)}
.past div>span{min-width:0}
.past small{color:var(--text-2);flex-shrink:0}
.pop-ft{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.pbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 18px;border:1px solid var(--panel-b);color:var(--text);cursor:pointer;background:rgba(255,255,255,.04);transition:.2s;font-size:14px}
.pbtn:hover{border-color:var(--glow);color:#fff}
.pbtn.main{background:linear-gradient(90deg,#2B6CFF,#3DD6FF);border:none;color:#fff;font-weight:600}
.pbtn.fav.on{color:var(--gold);border-color:var(--gold)}
.proto-back{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;border:1px solid rgba(255,255,255,.2)}
.proto-back:hover{background:rgba(0,0,0,.75)}
.ro-tag{font-size:12px;color:var(--gold);border:1px solid var(--gold);padding:2px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0}
</style>
</head>
<body>
<div class="screen">
  <!-- 顶栏 -->
  <div class="top">
    <nav class="top-nav" id="topNav">
      <a class="on" href="map.html"><i data-lucide="map"></i>数字地图</a>
      <a href="base-list.html"><i data-lucide="search"></i>基地检索</a>
      <a href="ranking.html"><i data-lucide="trophy"></i>资源榜单</a>
      <a href="cases.html"><i data-lucide="award"></i>优秀案例</a>
    </nav>
    <div class="title"><h1>社会实践基地资源库 · 数字地图</h1><small>SOCIAL PRACTICE BASE DIGITAL MAP</small></div>
    <div class="top-r">
      <span class="clock num" id="clock"></span>
      <select title="学年"><option>2025-2026 学年</option><option>2024-2025 学年</option><option>全部学年</option></select>
      <a class="tb" id="myLink" href="profile.html"><i data-lucide="user-round"></i>个人中心</a>
      <a class="me" id="meBox" href="profile.html"><img src="{{img:students2:80x80}}" alt="头像">张一鸣</a>
    </div>
  </div>

  <!-- 指标卡 -->
  <div class="kpis">
    <div class="kpi"><b class="num" data-count="286">0<small>个</small></b><span>全国实践基地总数</span></div>
    <div class="kpi"><b class="num" data-count="24">0<small>个</small></b><span>覆盖省份</span></div>
    <div class="kpi"><b class="num" data-count="27">0<small>个</small></b><span>参与学院</span></div>
    <div class="kpi"><b class="num" data-count="18642">0<small>人次</small></b><span>参与学生人次</span></div>
    <div class="kpi"><b class="num" data-count="312">0<small>个</small></b><span>参与团队数</span></div>
  </div>

  <!-- 主体 -->
  <div class="main">
    <!-- 左：专题筛选 -->
    <div class="panel">
      <div class="panel-hd">专题筛选<small>可多选</small></div>
      <div class="side-filters">
        <div class="cat-all"><span>已选 <b id="selCount">全部</b></span><a onclick="selectAll()">重置</a></div>
        <div class="extra">
          <div><label>基地级别</label><div class="seg" id="lvSeg"><span class="on" data-v="">全部</span><span data-v="校级">校级</span><span data-v="院级">院级</span></div></div>
          <div><label>可接待人数</label>
            <select id="capSel"><option value="0">不限</option><option value="30">30 人以上</option><option value="50">50 人以上</option><option value="80">80 人以上</option></select></div>
        </div>
      </div>
      <div class="panel-bd cat-scroll">
        <div class="cats" id="cats"></div>
      </div>
    </div>

    <!-- 中：地图 -->
    <div class="map-box">
      <div class="search">
        <input id="kw" placeholder="输入基地名称、地点或主题关键词，如：韶山 / 乡村振兴" autocomplete="off">
        <button onclick="doSearch()" title="搜索"><i data-lucide="search"></i></button>
      </div>
      <div class="suggest" id="suggest"></div>
      <div class="map-tip">当前显示 <b id="shown">0</b> 个基地点位 · 点击点位查看详情</div>
      <div id="map"></div>
      <div class="zoom-tools">
        <span onclick="zoomTo('全国')">全国</span><span onclick="zoomTo('湖南')">湖南</span><span onclick="zoomTo('长沙')">长沙</span>
      </div>
      <a class="ai-cta" id="aiCta" href="ai-match.html">
        <span class="ic"><i data-lucide="sparkles"></i></span>
        <span><b>为我推荐实践资源</b><small>AI 根据你的专业与意向智能匹配基地和案例</small></span>
        <i data-lucide="chevron-right"></i>
      </a>
    </div>

    <!-- 右：榜单 -->
    <div class="right">
      <div class="panel">
        <div class="panel-hd">优秀实践案例<a href="cases.html">全部 ›</a></div>
        <div class="panel-bd" style="overflow:hidden;padding-top:4px">
          <table class="rank-table"><thead><tr><th style="width:36px">排名</th><th>案例名称</th><th style="width:86px">学院</th></tr></thead></table>
          <div class="scroll-box" style="height:calc(100% - 26px)"><div class="scroll-inner"><table class="rank-table"><tbody id="caseRank"></tbody></table></div></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd">活跃基地 TOP 6<a href="ranking.html">榜单 ›</a></div>
        <div class="panel-bd"><div class="hot" id="hotList"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- 基地详情弹窗 -->
<div class="pop-mask" id="popMask" onclick="if(event.target===this)closePop()">
  <div class="pop">
    <div class="pop-hero"><img id="pImg" src="" alt="基地实景"><span class="x" onclick="closePop()"><i data-lucide="x"></i></span><h2 id="pName"></h2></div>
    <div class="pop-bd">
      <div class="pop-tags" id="pTags"></div>
      <div class="pop-grid" id="pGrid"></div>
      <h4><i data-lucide="info"></i>基地简介</h4>
      <p class="intro" id="pIntro"></p>
      <h4><i data-lucide="image"></i>实景图片</h4>
      <div class="pop-imgs" id="pImgs"></div>
      <h4><i data-lucide="award"></i>过往优秀实践案例（脱敏展示）</h4>
      <div class="past" id="pPast"></div>
      <div class="pop-ft">
        <span class="pbtn fav" id="favBtn" onclick="this.classList.toggle('on');this.lastChild.textContent=this.classList.contains('on')?'已收藏':'收藏'"><i data-lucide="star"></i><span>收藏</span></span>
        <a class="pbtn main" id="detailBtn" href="base-detail.html"><i data-lucide="file-text"></i>查看完整详情</a>
      </div>
    </div>
  </div>
</div>

<div class="viewer" id="viewer" onclick="if(event.target===this)closeShot()">
  <span class="x" onclick="closeShot()"><i data-lucide="x"></i></span>
  <span class="nav prev" id="shotPrev" onclick="stepShot(-1)"><i data-lucide="chevron-left"></i></span>
  <img id="vImg" alt="实景大图">
  <span class="nav next" id="shotNext" onclick="stepShot(1)"><i data-lucide="chevron-right"></i></span>
  <span class="cap" id="vCap">实景图片</span>
</div>

<a class="proto-back" href="../index.html"><i data-lucide="layout-grid"></i>原型导航</a>

<script>
// ========== 状态 ==========
const state = { cats: new Set(), lv: '', cap: 0 };
const pageParams = new URLSearchParams(location.search);
const isTeacher = pageParams.get('from') === 'teacher';
const isAdmin = pageParams.get('from') === 'admin';

// 教师端进入：导航切换为教师端页面，隐藏学生端个人操作
if (isTeacher) {
  document.getElementById('topNav').innerHTML = '<a href="../teacher/home.html"><i data-lucide="arrow-left"></i>返回教师端</a><a class="on" href="#"><i data-lucide="map"></i>数字地图</a><a href="../teacher/bases.html"><i data-lucide="map-pinned"></i>实践基地</a><a href="../teacher/cases.html"><i data-lucide="award"></i>榜单与案例</a>';
  document.getElementById('myLink').outerHTML = '<span class="ro-tag">指导教师 · 只读</span>';
  document.getElementById('meBox').innerHTML = '<img src="' + img('meeting', 80, 80) + '" alt="头像">陈思远';
  document.getElementById('meBox').href = '../teacher/home.html';
  document.getElementById('aiCta').style.display = 'none';
  document.getElementById('favBtn').style.display = 'none';
  document.getElementById('clock').style.display = 'none';
  Object.assign(document.getElementById('detailBtn'), { href: '../teacher/bases.html', innerHTML: '<i data-lucide="layout-grid"></i>返回基地列表' });
}

// 管理端进入：校级 / 院级只读查看，角色与管理端 localStorage、URL 保持一致
if (isAdmin) {
  var roleParam = pageParams.get('role');
  if (roleParam === 'school' || roleParam === 'college') localStorage.setItem('sjjd-role', roleParam);
  var adminRole = localStorage.getItem('sjjd-role') === 'college' ? 'college' : 'school';
  var adminHome = '../admin/dashboard.html?role=' + adminRole;
  var adminBases = '../admin/bases.html?role=' + adminRole;
  var isSchool = adminRole === 'school';
  document.getElementById('topNav').innerHTML = '<a href="' + adminHome + '"><i data-lucide="arrow-left"></i>返回管理端</a><a class="on" href="#"><i data-lucide="map"></i>数字地图</a><a href="' + adminBases + '"><i data-lucide="map-pinned"></i>实践基地</a>';
  document.getElementById('myLink').outerHTML = '<span class="ro-tag">' + (isSchool ? '校级管理员' : '院级管理员') + '</span>';
  document.getElementById('meBox').innerHTML = '<img src="' + img('team', 80, 80) + '" alt="头像">' + (isSchool ? '王建国' : '李敏');
  document.getElementById('meBox').href = adminHome;
  document.getElementById('aiCta').style.display = 'none';
  document.getElementById('favBtn').style.display = 'none';
  Object.assign(document.getElementById('detailBtn'), { href: adminBases, innerHTML: '<i data-lucide="layout-grid"></i>返回基地列表' });
}

// ========== 时钟 / 数字滚动 ==========
function tick(){ const d = new Date(); document.getElementById('clock').textContent = d.toLocaleDateString('zh-CN') + ' ' + d.toTimeString().slice(0, 8); }
tick(); setInterval(tick, 1000);
document.querySelectorAll('[data-count]').forEach(el => {
  const target = +el.dataset.count, unit = el.querySelector('small').outerHTML; let n = 0;
  const step = () => { n = Math.min(target, n + Math.ceil(target / 40)); el.innerHTML = n.toLocaleString() + unit; if (n < target) requestAnimationFrame(step); };
  step();
});

// ========== 左栏：专题图例 ==========
const catCount = CATS.map((_, i) => BASES.filter(b => b.c === i).length);
document.getElementById('cats').innerHTML = CATS.map((c, i) =>
  `<div class="cat" data-i="${i}" style="--c:${c.color}"><i></i><span>${c.name}</span><em class="num">${catCount[i] * 8 + 3}</em></div>`).join('');
document.getElementById('cats').addEventListener('click', e => {
  const el = e.target.closest('.cat'); if (!el) return;
  const i = +el.dataset.i; state.cats.has(i) ? state.cats.delete(i) : state.cats.add(i);
  el.classList.toggle('on'); render();
});
function selectAll(){ state.cats.clear(); document.querySelectorAll('.cat').forEach(c => c.classList.remove('on')); render(); }
document.getElementById('lvSeg').addEventListener('click', e => {
  if (!e.target.matches('span')) return; document.querySelectorAll('#lvSeg span').forEach(s => s.classList.remove('on'));
  e.target.classList.add('on'); state.lv = e.target.dataset.v; render();
});
document.getElementById('capSel').onchange = e => { state.cap = +e.target.value; render(); };

// ========== 地图 ==========
const chart = echarts.init(document.getElementById('map'));
const provCount = {};
BASES.forEach(b => provCount[b.prov] = (provCount[b.prov] || 0) + 1);

function filtered(){
  return BASES.filter(b => (!state.cats.size || state.cats.has(b.c)) && (!state.lv || b.lv === state.lv) && b.cap >= state.cap);
}
function render(){
  const list = filtered();
  document.getElementById('shown').textContent = list.length;
  document.getElementById('selCount').textContent = state.cats.size ? state.cats.size + ' 类' : '全部';
  chart.setOption({ series: [{ id: 'bases', data: list.map(b => ({ name: b.name, value: [b.lng, b.lat, b.cap], base: b, itemStyle: { color: CATS[b.c].color } })) }] });
}
chart.setOption({
  tooltip: { trigger: 'item', backgroundColor: 'rgba(6,26,74,.92)', borderColor: '#3DD6FF', textStyle: { color: '#E6F0FF' },
    formatter: p => p.data && p.data.base ? `<b>${p.data.base.name}</b><br/><span style="color:${CATS[p.data.base.c].color}">● </span>${CATS[p.data.base.c].name}<br/>${p.data.base.lv}基地 · ${p.data.base.prov}${p.data.base.city}` : `${p.name}：${provCount[p.name] || 0} 个基地` },
  visualMap: { show: true, min: 0, max: 20, left: 16, bottom: 90, itemWidth: 10, itemHeight: 80, text: ['基地多', '少'], textStyle: { color: '#9FB7E6', fontSize: 11 }, inRange: { color: ['#123A8F', '#1E5BD8', '#3D8BFF'] }, seriesIndex: 0, calculable: false },
  geo: { map: 'china', roam: true, zoom: 1.2, center: [104, 36], scaleLimit: { min: 1, max: 30 },
    label: { show: false }, itemStyle: { areaColor: '#123A8F', borderColor: '#3DD6FF', borderWidth: .8, shadowColor: 'rgba(61,214,255,.4)', shadowBlur: 10 },
    emphasis: { label: { show: true, color: '#fff' }, itemStyle: { areaColor: '#2B6CFF' } } },
  series: [
    { type: 'map', map: 'china', geoIndex: 0, data: Object.keys(provCount).map(k => ({ name: k, value: provCount[k] * 4 })) },
    { id: 'bases', type: 'effectScatter', coordinateSystem: 'geo', symbolSize: v => 8 + v[2] / 12, rippleEffect: { scale: 3, brushType: 'stroke' },
      itemStyle: { shadowBlur: 10, shadowColor: '#fff', borderColor: '#fff', borderWidth: 1 }, zlevel: 2, data: [] }
  ]
});
render();
chart.on('click', p => { if (p.data && p.data.base) openPop(p.data.base); });
window.addEventListener('resize', () => chart.resize());

const VIEWS = { 全国: { center: [104, 36], zoom: 1.2 }, 湖南: { center: [111.7, 27.6], zoom: 6 }, 长沙: { center: [112.98, 28.2], zoom: 22 } };
function zoomTo(k){ chart.setOption({ geo: VIEWS[k] }); }
function locate(b){ chart.setOption({ geo: { center: [b.lng, b.lat], zoom: 8 } }); setTimeout(() => openPop(b), 400); }

// ========== 搜索：名称 / 地点 / 主题 ==========
const kw = document.getElementById('kw'), sug = document.getElementById('suggest');
function match(q){ return BASES.filter(b => (b.name + b.prov + b.city + CATS[b.c].name).includes(q)); }
kw.addEventListener('input', () => {
  const q = kw.value.trim(); if (!q) { sug.style.display = 'none'; return; }
  const list = match(q).slice(0, 8);
  sug.innerHTML = list.length ? list.map(b => `<div onclick="pick(${b.id})"><span>${b.name}</span><small>${b.prov}·${CATS[b.c].name}</small></div>`).join('') : '<div>未找到相关基地</div>';
  sug.style.display = 'block';
});
kw.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
function pick(id){ sug.style.display = 'none'; const b = BASES.find(x => x.id === id); kw.value = b.name; locate(b); }
function doSearch(){ const r = match(kw.value.trim()); sug.style.display = 'none'; if (r.length) locate(r[0]); }

// ========== 弹窗 ==========
function popCell(k, v, full){
  return `<div${full ? ' class="full"' : ''}><span class="k">${k}</span><span class="v">${v}</span></div>`;
}
function openPop(b){
  const c = CATS[b.c];
  document.getElementById('pImg').src = img(b.img, 900, 360);
  document.getElementById('pName').textContent = b.name;
  document.getElementById('pTags').innerHTML = `<span class="ptag" style="--c:${c.color}">${c.name}</span><span class="ptag">${b.lv}基地</span>${b.col ? `<span class="ptag">${b.col}上报</span>` : ''}<span class="ptag">${b.prov} · ${b.city}</span>`;
  const themes = (b.themes && b.themes.length) ? b.themes.join('、') : c.name;
  document.getElementById('pGrid').innerHTML = [
    popCell('基地编号', b.code || '—'),
    popCell('牵头单位', b.lead || '—'),
    popCell('共建单位', b.unit || '—'),
    popCell('单位类型', b.unitType || '—'),
    popCell('基地类型', b.baseType || '—'),
    popCell('实践主题', themes),
    popCell('岗位数量', `${b.cap} 人`),
    popCell('是否授牌', b.awarded ? '是' : '否'),
    popCell('联系人', `${b.contact || '—'} · <span class="num">${b.phone || '—'}</span>`),
    popCell('开放时间', b.openTime || '—'),
    popCell('地址', b.addr || b.region || '—', true)
  ].join('');
  document.getElementById('pIntro').textContent = b.intro || '';
  shots = (b.photos && b.photos.length ? b.photos : [b.img, 'students', 'team']).slice();
  document.getElementById('pImgs').innerHTML = shots.map((k, i) => `<img src="${img(k, 480, 300)}" alt="实景" onclick="openShot(${i})">`).join('');
  const past = (b.caseIds || []).map(id => CASES.find(x => x.id === id)).filter(Boolean);
  const shown = past.length ? past : CASES.filter(x => x.c === b.c).slice(0, 2);
  document.getElementById('pPast').innerHTML = (shown.length ? shown : CASES.slice(0, 2)).map(x => `<div><span>${x.title}</span><small>${x.col.replace(/学院/, '**学院')} · ${x.year}</small></div>`).join('');
  if (!isTeacher && !isAdmin) document.getElementById('detailBtn').href = 'base-detail.html?id=' + b.id;
  document.getElementById('popMask').classList.add('show');
  refreshIcons();
}
function closePop(){ document.getElementById('popMask').classList.remove('show'); closeShot(); }
let shots = [], shotIdx = 0;
function openShot(i){
  shotIdx = i;
  document.getElementById('vImg').src = img(shots[i], 1600, 1000);
  document.getElementById('vCap').textContent = `实景图片 ${i + 1} / ${shots.length}`;
  const single = shots.length < 2;
  document.getElementById('shotPrev').style.display = single ? 'none' : '';
  document.getElementById('shotNext').style.display = single ? 'none' : '';
  document.getElementById('viewer').classList.add('show');
  refreshIcons();
}
function stepShot(d){ if (shots.length > 1) openShot((shotIdx + d + shots.length) % shots.length); }
function closeShot(){ document.getElementById('viewer').classList.remove('show'); }
document.addEventListener('keydown', e => {
  if (!document.getElementById('viewer').classList.contains('show')) return;
  if (e.key === 'Escape') closeShot();
  if (e.key === 'ArrowLeft') stepShot(-1);
  if (e.key === 'ArrowRight') stepShot(1);
});

// ========== 右栏 ==========
const rankRows = CASES.map((c, i) => `<tr onclick="location.href='case-detail.html?id=${c.id}'"><td style="width:36px"><span class="rank-no ${i < 3 ? 'top' : ''}">${i + 1}</span></td><td>${c.title}</td><td style="width:86px;color:#9FB7E6">${c.col}</td></tr>`).join('');
document.getElementById('caseRank').innerHTML = rankRows + rankRows;
const hot = [...BASES].sort((a, b) => b.persons - a.persons).slice(0, 6);
// AI 推荐页「定位地图」跳转：map.html?locate=基地ID
const locateId = +new URLSearchParams(location.search).get('locate');
if (locateId) setTimeout(() => locate(BASES.find(b => b.id === locateId)), 600);
document.getElementById('hotList').innerHTML = hot.map((b, i) => `<div class="hot-item" onclick='locate(BASES.find(x=>x.id===${b.id}))'><span class="rank-no ${i < 3 ? 'top' : ''}">${i + 1}</span><span class="nm">${b.name}</span><span class="vv num">${b.persons}人次</span><div class="bar"><i style="width:${b.persons / hot[0].persons * 100}%"></i></div></div>`).join('');
refreshIcons();
</script>
</body>
</html>
