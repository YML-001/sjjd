---
title: 活跃基地榜
layout: student
menu: ranking
crumb: 首页 / 资源榜单 / 活跃基地榜
inject: data
---
<style>
.rank-hd{display:flex;justify-content:space-between;align-items:center}
.update{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.update i.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:18px;align-items:end;margin:6px 0 22px}
.pd{position:relative;border-radius:14px;overflow:hidden;color:#fff;cursor:pointer;transition:.25s}
.pd:hover{transform:translateY(-4px)}
.pd img{width:100%;height:220px}
.pd.first img{height:260px}
/* 遮罩和奖牌不挡点击：点照片放大，点底部文字仍进入基地详情 */
.pd::after,.pd .medal{pointer-events:none}
.pd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(10,20,50,.9))}
.pd .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:18px 20px}
.pd .medal{position:absolute;left:16px;top:16px;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:800;color:#5A2A00;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.m1{background:linear-gradient(135deg,#FFE08A,#F5A524)}.m2{background:linear-gradient(135deg,#F1F5F9,#94A3B8)}.m3{background:linear-gradient(135deg,#FCD9B6,#C2793B)}
.pd h3{font-size:18px}
.pd .nums{display:flex;gap:18px;margin-top:8px;font-size:12px;opacity:.9}
.pd .nums b{font-size:18px;display:block}
.score{display:flex;align-items:center;gap:8px}
.score .bar{width:90px}
.trend-up{color:var(--danger);display:inline-flex;align-items:center;font-size:12px}
.trend-down{color:var(--success);display:inline-flex;align-items:center;font-size:12px}
.no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:#F1F3F6;font-weight:600;font-size:13px}
</style>

<div class="tabs"><a class="on" href="ranking.html"><i data-lucide="flame"></i>活跃基地榜</a><a href="cases.html"><i data-lucide="award"></i>优秀案例榜</a></div>

<div class="rank-hd mb-16">
  <div class="filter-bar">
    <select class="select"><option>2025-2026 学年</option><option>2025 秋季学期</option><option>2024-2025 学年</option></select>
    <select class="select" id="catSel"><option value="">全部专题</option></select>
    <select class="select"><option>全部级别</option><option>校级基地</option><option>院级基地</option></select>
  </div>
  <span class="update"><i class="dot"></i>榜单实时从第二课堂数据库计算刷新 · 更新于 今天 08:00 · 综合得分 = 项目数 40% + 参与人次 35% + 实践时长 25%</span>
</div>

<div class="podium" id="podium"></div>

<div class="card">
  <table class="table">
    <thead><tr><th style="width:70px">排名</th><th>实践基地</th><th>专题</th><th class="r">立项项目数</th><th class="r">参与人次</th><th class="r">实践时长(h)</th><th>综合得分</th><th>较上期</th><th style="width:90px">操作</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="pager" style="padding:0 16px 16px"><span class="total">共 286 个基地上榜</span><a><i data-lucide="chevron-left"></i></a><a class="on">1</a><a>2</a><a>3</a><span>…</span><a>15</a><a><i data-lucide="chevron-right"></i></a></div>
</div>

<script>
document.getElementById('catSel').innerHTML += CATS.map((c, i) => `<option value="${i}">${c.name}</option>`).join('');
const list = [...BASES].sort((a, b) => b.persons - a.persons).map((b, i) => ({ ...b, projects: Math.round(b.persons / 22) + 3, hours: b.persons * 6, score: (98.6 - i * 2.1).toFixed(1), trend: [2, -1, 0, 3, 1, -2][i % 6] }));
const order = [1, 0, 2];
document.getElementById('podium').innerHTML = order.map(i => { const b = list[i]; return `
  <div class="pd ${i === 0 ? 'first' : ''}" onclick="location.href='base-detail.html'">
    <img data-shot="基地图片" src="${img(b.img, 700, 520)}" alt="${b.name}"><span class="medal m${i + 1}">${i + 1}</span>
    <div class="in"><span class="tag tag-c" style="--c:#fff;background:rgba(255,255,255,.2);color:#fff">${CATS[b.c].name}</span>
      <h3 class="mt-8">${b.name}</h3>
      <div class="nums"><span><b class="num">${b.projects}</b>立项项目</span><span><b class="num">${b.persons}</b>参与人次</span><span><b class="num">${b.score}</b>综合得分</span></div></div>
  </div>`; }).join('');
document.getElementById('rows').innerHTML = list.slice(3, 15).map((b, i) => `<tr>
  <td><span class="no">${i + 4}</span></td>
  <td><div class="cell-main"><img data-shot="基地图片" src="${img(b.img, 120, 80)}" alt=""><div><b>${b.name}</b><small>${b.lv}基地 · ${b.prov}${b.city}</small></div></div></td>
  <td>${catTag(b.c)}</td><td class="r num">${b.projects}</td><td class="r num">${b.persons.toLocaleString()}</td><td class="r num">${b.hours.toLocaleString()}</td>
  <td><div class="score"><div class="bar"><i style="width:${b.score}%"></i></div><span class="num">${b.score}</span></div></td>
  <td>${b.trend > 0 ? `<span class="trend-up"><i data-lucide="arrow-up"></i>${b.trend}</span>` : b.trend < 0 ? `<span class="trend-down"><i data-lucide="arrow-down"></i>${-b.trend}</span>` : '<span class="muted">—</span>'}</td>
  <td><a class="btn-text" href="base-detail.html">查看基地</a></td></tr>`).join('');
</script>

<!-- 内容图灯箱 -->
<script>
// 内容图灯箱：点哪张看哪张；同一组可左右切换。关闭大图不离开当前页，也不关掉底下的弹窗。
(function () {
  if (document.getElementById('shotViewer')) return;
  var css = document.createElement('style');
  css.textContent = ''
    + 'img[data-shot],[data-shots] img{cursor:zoom-in}'
    + '.shot-viewer{position:fixed;inset:0;z-index:240;background:rgba(15,23,42,.86);display:none;align-items:center;justify-content:center}'
    + '.shot-viewer.show{display:flex}'
    + '.shot-viewer img{flex:0 0 auto;max-width:min(1080px,82vw);max-height:82vh;width:auto;height:auto;object-fit:contain;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.45);background:#111827;cursor:default}'
    + '.shot-viewer .x,.shot-viewer .nav{position:absolute;z-index:2;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);user-select:none}'
    + '.shot-viewer .x{right:22px;top:18px;width:36px;height:36px;border-radius:50%}'
    + '.shot-viewer .nav{top:50%;width:42px;height:64px;margin-top:-32px;border-radius:8px}'
    + '.shot-viewer .prev{left:18px}.shot-viewer .next{right:18px}'
    + '.shot-viewer .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#E5E7EB;font-size:13px;letter-spacing:1px;pointer-events:none}';
  document.head.appendChild(css);

  var box = document.createElement('div');
  box.className = 'shot-viewer';
  box.id = 'shotViewer';
  box.innerHTML = '<span class="x" title="关闭"><i data-lucide="x"></i></span>'
    + '<span class="nav prev" title="上一张"><i data-lucide="chevron-left"></i></span>'
    + '<img alt="大图">'
    + '<span class="nav next" title="下一张"><i data-lucide="chevron-right"></i></span>'
    + '<span class="cap">图片</span>';
  document.body.appendChild(box);

  var urls = [], index = 0, label = '图片';
  var big = box.querySelector('img');
  var cap = box.querySelector('.cap');
  var prev = box.querySelector('.prev');
  var next = box.querySelector('.next');

  function enlarge(src) {
    var w = /[?&]w=(\d+)/.exec(src);
    var h = /[?&]h=(\d+)/.exec(src);
    if (!w) return src;
    var nw = 1600;
    var nh = h ? Math.max(1, Math.round(Number(h[1]) * nw / Number(w[1]))) : 0;
    var out = src.replace(/([?&])w=\d+/, '$1w=' + nw);
    if (nh) out = out.replace(/([?&])h=\d+/, '$1h=' + nh);
    return out;
  }
  var token = 0;
  function fit() {
    if (!big.naturalWidth || !big.naturalHeight) return;
    var maxW = Math.min(1080, window.innerWidth * 0.82);
    var maxH = window.innerHeight * 0.82;
    var scale = Math.min(maxW / big.naturalWidth, maxH / big.naturalHeight);
    big.style.width = Math.max(1, Math.round(big.naturalWidth * scale)) + 'px';
    big.style.height = Math.max(1, Math.round(big.naturalHeight * scale)) + 'px';
  }
  function paint() {
    var my = ++token;
    var thumb = urls[index];
    var full = enlarge(thumb);
    function apply(src) {
      if (my !== token) return;
      if (big.src === src && big.complete && big.naturalWidth) { fit(); return; }
      big.onload = function () { if (my === token) fit(); };
      big.src = src;
      if (my === token && big.complete && big.naturalWidth) fit();
    }
    // 先用页面上已经加载的缩略图撑开大图，再换成更高清的地址
    apply(thumb);
    if (full !== thumb) {
      var pre = new Image();
      pre.onload = function () { apply(full); };
      pre.src = full;
    }
    cap.textContent = label + ' ' + (index + 1) + ' / ' + urls.length;
    var single = urls.length < 2;
    prev.style.display = single ? 'none' : '';
    next.style.display = single ? 'none' : '';
  }

  function open(list, i, lab) {
    urls = list;
    index = i;
    label = lab || '图片';
    paint();
    box.classList.add('show');
    if (window.refreshIcons) refreshIcons();
  }
  function step(d) {
    if (urls.length < 2) return;
    index = (index + d + urls.length) % urls.length;
    paint();
  }
  function close() { box.classList.remove('show'); }

  box.addEventListener('click', function (e) { if (e.target === box) close(); });
  box.querySelector('.x').addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    close();
  });
  prev.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    step(-1);
  });
  next.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    step(1);
  });

  function shotFromEvent(e) {
    var t = e.target;
    if (!t) return null;
    if (t.nodeType !== 1) t = t.parentElement;
    if (!t || !t.closest) return null;
    var im = t.closest('img');
    if (!im || im.closest('.shot-viewer')) return null;
    if (!im.hasAttribute('data-shot') && !im.closest('[data-shots]')) return null;
    return im;
  }
  function onPick(e) {
    var im = shotFromEvent(e);
    if (!im) return;
    e.preventDefault();
    e.stopPropagation();
    var group = im.closest('[data-shots]');
    if (group) {
      var imgs = Array.prototype.slice.call(group.querySelectorAll('img'));
      open(imgs.map(function (el) { return el.currentSrc || el.src; }), Math.max(0, imgs.indexOf(im)), group.getAttribute('data-shots') || '图片');
    } else {
      open([im.currentSrc || im.src], 0, im.getAttribute('data-shot') || '图片');
    }
  }
  document.addEventListener('click', onPick, true);
  document.addEventListener('auxclick', onPick, true);
  document.addEventListener('keydown', function (e) {
    if (!box.classList.contains('show')) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  }, true);
})();
</script>
