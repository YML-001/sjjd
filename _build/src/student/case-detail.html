<style>
.layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.article{padding:32px 40px}
.article h1{font-size:28px;line-height:1.4;margin:0}
.case-k{font-size:13px;color:var(--text-3);margin-bottom:6px}
.case-meta{margin:16px 0 4px}
.article .cover{width:100%;height:360px;border-radius:12px}
.article h3{font-size:18px;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.article h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--red)}
.article p{color:var(--text-2);line-height:2;font-size:15px}
.summary{background:linear-gradient(135deg,#FFF7ED,#FEF2F2);border:1px solid #FDE2D3;border-radius:12px;padding:18px 22px;color:var(--text-2);line-height:1.9}
.files .file{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.files .file:last-child{border:none}
.files .file .muted{margin-left:auto}
.achieve{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
.achieve div{text-align:center;padding:16px 8px;border-radius:10px;background:#F7F9FC}
.achieve b{display:block;font-size:26px;color:var(--primary)}
.achieve span{font-size:12px;color:var(--text-3)}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pics img{width:100%;height:150px;border-radius:8px}
.aside-col{display:grid;gap:16px;position:sticky;top:84px}
.base-link{display:flex;gap:12px;align-items:center}
.base-link img{width:72px;height:56px;border-radius:8px}
.rel a{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rel a:last-child{border:none}
.rel img{width:72px;height:52px;border-radius:6px;flex-shrink:0}
.rel b{font-size:13px;font-weight:500}
.rel a:hover b{color:var(--primary)}
</style>

<div class="layout">
  <div class="card article">
    <div id="caseBody"></div>
    <div class="flex gap-12 mt-24" style="border-top:1px solid var(--line);padding-top:20px">
      <button class="btn btn-primary" onclick="toast('已复制申报模板框架到剪贴板')"><i data-lucide="copy"></i>复制申报模板</button>
      <button class="btn" onclick="toast('已加入我的收藏')"><i data-lucide="star"></i>收藏案例</button>
      <button class="btn" onclick="toast('即将跳转第二课堂 · 项目档案','external-link')"><i data-lucide="external-link"></i>查看完整项目档案</button>
    </div>
  </div>

  <div class="aside-col">
    <div class="card">
      <div class="card-hd"><h3>实践基地</h3></div>
      <div class="card-bd">
        <div class="base-link" id="baseLink"></div>
        <div class="mt-16"><a class="btn btn-sm btn-primary" id="baseHref" href="base-detail.html">基地详情</a></div>
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><h3>同主题案例</h3></div>
      <div class="card-bd rel" id="relList" style="padding-top:6px;padding-bottom:6px"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var c = caseFromQuery(3);
  document.getElementById('caseBody').innerHTML = caseReadHtml(c);
  var b = null;
  var i;
  for (i = 0; i < BASES.length; i++) if (BASES[i].id === c.baseId) b = BASES[i];
  if (b) {
    document.getElementById('baseLink').innerHTML = '<img data-shot="基地图片" src="' + img(b.img, 200, 160) + '" alt=""><div><b>' + htmlEsc(b.name) + '</b><div class="muted small">' + htmlEsc(b.lv) + '基地 · ' + htmlEsc(b.prov + b.city) + '</div></div>';
    document.getElementById('baseHref').setAttribute('href', 'base-detail.html?id=' + b.id);
  }
  var rel = [];
  function has(id) {
    var j;
    for (j = 0; j < rel.length; j++) if (rel[j].id === id) return true;
    return false;
  }
  for (i = 0; i < CASES.length && rel.length < 3; i++) {
    if (CASES[i].id !== c.id && CASES[i].c === c.c) rel.push(CASES[i]);
  }
  for (i = 0; i < CASES.length && rel.length < 3; i++) {
    if (CASES[i].id !== c.id && !has(CASES[i].id)) rel.push(CASES[i]);
  }
  document.getElementById('relList').innerHTML = rel.map(function (r) {
    return '<a href="case-detail.html?id=' + r.id + '"><img data-shot="案例封面" src="' + img(r.img, 160, 120) + '" alt=""><div><b class="clamp-2">' + htmlEsc(r.title) + '</b><div class="muted small">' + htmlEsc(r.col) + ' · ' + htmlEsc(r.year) + '</div></div></a>';
  }).join('');
  if (window.refreshIcons) refreshIcons();
})();
</script>

<!-- 内容图灯箱 -->
<script>
// 内容图灯箱：点哪张看哪张；同一组可左右切换。关闭大图不离开当前页，也不关掉底下的弹窗。
(function () {
  if (document.getElementById('shotViewer')) return;
  var css = document.createElement('style');
  css.textContent = ''
    + 'img[data-shot],[data-shots] img{cursor:zoom-in}'
    + '.shot-viewer{position:fixed;inset:0;z-index:240;background:rgba(15,23,42,.86);display:none;align-items:center;justify-content:center}'
    + '.shot-viewer.show{display:flex}'
    + '.shot-viewer img{flex:0 0 auto;max-width:min(1080px,82vw);max-height:82vh;width:auto;height:auto;object-fit:contain;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.45);background:#111827;cursor:default}'
    + '.shot-viewer .x,.shot-viewer .nav{position:absolute;z-index:2;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);user-select:none}'
    + '.shot-viewer .x{right:22px;top:18px;width:36px;height:36px;border-radius:50%}'
    + '.shot-viewer .nav{top:50%;width:42px;height:64px;margin-top:-32px;border-radius:8px}'
    + '.shot-viewer .prev{left:18px}.shot-viewer .next{right:18px}'
    + '.shot-viewer .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#E5E7EB;font-size:13px;letter-spacing:1px;pointer-events:none}';
  document.head.appendChild(css);

  var box = document.createElement('div');
  box.className = 'shot-viewer';
  box.id = 'shotViewer';
  box.innerHTML = '<span class="x" title="关闭"><i data-lucide="x"></i></span>'
    + '<span class="nav prev" title="上一张"><i data-lucide="chevron-left"></i></span>'
    + '<img alt="大图">'
    + '<span class="nav next" title="下一张"><i data-lucide="chevron-right"></i></span>'
    + '<span class="cap">图片</span>';
  document.body.appendChild(box);

  var urls = [], index = 0, label = '图片';
  var big = box.querySelector('img');
  var cap = box.querySelector('.cap');
  var prev = box.querySelector('.prev');
  var next = box.querySelector('.next');

  function enlarge(src) {
    var w = /[?&]w=(\d+)/.exec(src);
    var h = /[?&]h=(\d+)/.exec(src);
    if (!w) return src;
    var nw = 1600;
    var nh = h ? Math.max(1, Math.round(Number(h[1]) * nw / Number(w[1]))) : 0;
    var out = src.replace(/([?&])w=\d+/, '$1w=' + nw);
    if (nh) out = out.replace(/([?&])h=\d+/, '$1h=' + nh);
    return out;
  }
  var token = 0;
  function fit() {
    if (!big.naturalWidth || !big.naturalHeight) return;
    var maxW = Math.min(1080, window.innerWidth * 0.82);
    var maxH = window.innerHeight * 0.82;
    var scale = Math.min(maxW / big.naturalWidth, maxH / big.naturalHeight);
    big.style.width = Math.max(1, Math.round(big.naturalWidth * scale)) + 'px';
    big.style.height = Math.max(1, Math.round(big.naturalHeight * scale)) + 'px';
  }
  function paint() {
    var my = ++token;
    var thumb = urls[index];
    var full = enlarge(thumb);
    function apply(src) {
      if (my !== token) return;
      if (big.src === src && big.complete && big.naturalWidth) { fit(); return; }
      big.onload = function () { if (my === token) fit(); };
      big.src = src;
      if (my === token && big.complete && big.naturalWidth) fit();
    }
    // 先用页面上已经加载的缩略图撑开大图，再换成更高清的地址
    apply(thumb);
    if (full !== thumb) {
      var pre = new Image();
      pre.onload = function () { apply(full); };
      pre.src = full;
    }
    cap.textContent = label + ' ' + (index + 1) + ' / ' + urls.length;
    var single = urls.length < 2;
    prev.style.display = single ? 'none' : '';
    next.style.display = single ? 'none' : '';
  }

  function open(list, i, lab) {
    urls = list;
    index = i;
    label = lab || '图片';
    paint();
    box.classList.add('show');
    if (window.refreshIcons) refreshIcons();
  }
  function step(d) {
    if (urls.length < 2) return;
    index = (index + d + urls.length) % urls.length;
    paint();
  }
  function close() { box.classList.remove('show'); }

  box.addEventListener('click', function (e) { if (e.target === box) close(); });
  box.querySelector('.x').addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    close();
  });
  prev.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    step(-1);
  });
  next.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    step(1);
  });

  function shotFromEvent(e) {
    var t = e.target;
    if (!t) return null;
    if (t.nodeType !== 1) t = t.parentElement;
    if (!t || !t.closest) return null;
    var im = t.closest('img');
    if (!im || im.closest('.shot-viewer')) return null;
    if (!im.hasAttribute('data-shot') && !im.closest('[data-shots]')) return null;
    return im;
  }
  function onPick(e) {
    var im = shotFromEvent(e);
    if (!im) return;
    e.preventDefault();
    e.stopPropagation();
    var group = im.closest('[data-shots]');
    if (group) {
      var imgs = Array.prototype.slice.call(group.querySelectorAll('img'));
      open(imgs.map(function (el) { return el.currentSrc || el.src; }), Math.max(0, imgs.indexOf(im)), group.getAttribute('data-shots') || '图片');
    } else {
      open([im.currentSrc || im.src], 0, im.getAttribute('data-shot') || '图片');
    }
  }
  document.addEventListener('click', onPick, true);
  document.addEventListener('auxclick', onPick, true);
  document.addEventListener('keydown', function (e) {
    if (!box.classList.contains('show')) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  }, true);
})();
</script>
