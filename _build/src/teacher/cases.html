<div class="page-hd">

      <div class="chips" data-chips="single" id="yrChips"><span class="chip on" data-v="">全部学年</span><span class="chip" data-v="2025-2026">2025-2026</span><span class="chip" data-v="2024-2025">2024-2025</span><span class="chip" data-v="2023-2024">2023-2024</span></div>

    <div class="modal-hd">案例详情（只读）<span class="x" onclick="closeModal('cM')"><i data-lucide="x"></i></span></div>

<script>
const top10 = [...BASES].sort((a, b) => b.persons - a.persons).slice(0, 10);
document.getElementById('rank').innerHTML = top10.map((b, i) => `<div class="rk"><span class="no ${i < 3 ? 'top' : ''}">${i + 1}</span>
  <div class="nm"><div class="ellipsis">${b.name}</div><div class="bar"><i style="width:${b.persons / top10[0].persons * 100}%"></i></div></div><span class="v num">${b.persons} 人次</span></div>`).join('');
let yr = '';
function render(){
  document.getElementById('cases').innerHTML = CASES.filter(c => !yr || c.year === yr).map(c => `<div class="cc" onclick="show(${c.id})">
    <img data-shot="案例封面" src="${img(c.img, 480, 260)}" alt="" loading="lazy"><div class="bd">${catTag(c.c)}<h4 class="clamp-2">${c.title}</h4>
    <div class="m"><span>${c.col}</span><span><i data-lucide="eye" style="width:12px;height:12px"></i> ${c.views}</span></div></div></div>`).join('');
  refreshIcons();
}
function show(id){
  const c = CASES.find(x => x.id === id);
  document.getElementById('cBd').innerHTML = caseReadHtml(c);
  openModal('cM');
  refreshIcons();
}
document.querySelectorAll('#yrChips .chip').forEach(c => c.addEventListener('click', () => { yr = c.dataset.v; render(); }));
render();
</script>

<!-- 内容图灯箱 -->
<script>
// 内容图灯箱：点哪张看哪张；同一组可左右切换。关闭大图不离开当前页，也不关掉底下的弹窗。
(function () {
  if (document.getElementById('shotViewer')) return;
  var css = document.createElement('style');
  css.textContent = ''
    + 'img[data-shot],[data-shots] img{cursor:zoom-in}'
    + '.shot-viewer{position:fixed;inset:0;z-index:240;background:rgba(15,23,42,.86);display:none;align-items:center;justify-content:center}'
    + '.shot-viewer.show{display:flex}'
    + '.shot-viewer img{flex:0 0 auto;max-width:min(1080px,82vw);max-height:82vh;width:auto;height:auto;object-fit:contain;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.45);background:#111827;cursor:default}'
    + '.shot-viewer .x,.shot-viewer .nav{position:absolute;z-index:2;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);user-select:none}'
    + '.shot-viewer .x{right:22px;top:18px;width:36px;height:36px;border-radius:50%}'
    + '.shot-viewer .nav{top:50%;width:42px;height:64px;margin-top:-32px;border-radius:8px}'
    + '.shot-viewer .prev{left:18px}.shot-viewer .next{right:18px}'
    + '.shot-viewer .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#E5E7EB;font-size:13px;letter-spacing:1px;pointer-events:none}';
  document.head.appendChild(css);

  var box = document.createElement('div');
  box.className = 'shot-viewer';
  box.id = 'shotViewer';
  box.innerHTML = '<span class="x" title="关闭"><i data-lucide="x"></i></span>'
    + '<span class="nav prev" title="上一张"><i data-lucide="chevron-left"></i></span>'
    + '<img alt="大图">'
    + '<span class="nav next" title="下一张"><i data-lucide="chevron-right"></i></span>'
    + '<span class="cap">图片</span>';
  document.body.appendChild(box);

  var urls = [], index = 0, label = '图片';
  var big = box.querySelector('img');
  var cap = box.querySelector('.cap');
  var prev = box.querySelector('.prev');
  var next = box.querySelector('.next');

  function enlarge(src) {
    var w = /[?&]w=(\d+)/.exec(src);
    var h = /[?&]h=(\d+)/.exec(src);
    if (!w) return src;
    var nw = 1600;
    var nh = h ? Math.max(1, Math.round(Number(h[1]) * nw / Number(w[1]))) : 0;
    var out = src.replace(/([?&])w=\d+/, '$1w=' + nw);
    if (nh) out = out.replace(/([?&])h=\d+/, '$1h=' + nh);
    return out;
  }
  var token = 0;
  function fit() {
    if (!big.naturalWidth || !big.naturalHeight) return;
    var maxW = Math.min(1080, window.innerWidth * 0.82);
    var maxH = window.innerHeight * 0.82;
    var scale = Math.min(maxW / big.naturalWidth, maxH / big.naturalHeight);
    big.style.width = Math.max(1, Math.round(big.naturalWidth * scale)) + 'px';
    big.style.height = Math.max(1, Math.round(big.naturalHeight * scale)) + 'px';
  }
  function paint() {
    var my = ++token;
    var thumb = urls[index];
    var full = enlarge(thumb);
    function apply(src) {
      if (my !== token) return;
      if (big.src === src && big.complete && big.naturalWidth) { fit(); return; }
      big.onload = function () { if (my === token) fit(); };
      big.src = src;
      if (my === token && big.complete && big.naturalWidth) fit();
    }
    // 先用页面上已经加载的缩略图撑开大图，再换成更高清的地址
    apply(thumb);
    if (full !== thumb) {
      var pre = new Image();
      pre.onload = function () { apply(full); };
      pre.src = full;
    }
    cap.textContent = label + ' ' + (index + 1) + ' / ' + urls.length;
    var single = urls.length < 2;
    prev.style.display = single ? 'none' : '';
    next.style.display = single ? 'none' : '';
  }

  function open(list, i, lab) {
    urls = list;
    index = i;
    label = lab || '图片';
    paint();
    box.classList.add('show');
    if (window.refreshIcons) refreshIcons();
  }
  function step(d) {
    if (urls.length < 2) return;
    index = (index + d + urls.length) % urls.length;
    paint();
  }
  function close() { box.classList.remove('show'); }

  box.addEventListener('click', function (e) { if (e.target === box) close(); });
  box.querySelector('.x').addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    close();
  });
  prev.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    step(-1);
  });
  next.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    step(1);
  });

  function shotFromEvent(e) {
    var t = e.target;
    if (!t) return null;
    if (t.nodeType !== 1) t = t.parentElement;
    if (!t || !t.closest) return null;
    var im = t.closest('img');
    if (!im || im.closest('.shot-viewer')) return null;
    if (!im.hasAttribute('data-shot') && !im.closest('[data-shots]')) return null;
    return im;
  }
  function onPick(e) {
    var im = shotFromEvent(e);
    if (!im) return;
    e.preventDefault();
    e.stopPropagation();
    var group = im.closest('[data-shots]');
    if (group) {
      var imgs = Array.prototype.slice.call(group.querySelectorAll('img'));
      open(imgs.map(function (el) { return el.currentSrc || el.src; }), Math.max(0, imgs.indexOf(im)), group.getAttribute('data-shots') || '图片');
    } else {
      open([im.currentSrc || im.src], 0, im.getAttribute('data-shot') || '图片');
    }
  }
  document.addEventListener('click', onPick, true);
  document.addEventListener('auxclick', onPick, true);
  document.addEventListener('keydown', function (e) {
    if (!box.classList.contains('show')) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  }, true);
})();
</script>
